[package]
name = "tetsu-bar"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Tetsu status bar: clock, battery, network and workspaces on a layer surface"

[lints]
workspace = true

[dependencies]
cosmic-text = "0.19.0"
jiff = "0.2"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
tetsu-bus = { path = "../tetsu-bus" }
tiny-skia = "0.12.0"
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros", "signal"] }

[dev-dependencies]
serde_json = "1.0.154"
tempfile = "3"
tetsu-bus-contract = { path = "../tetsu-bus-contract" }
tokio = { version = "1.54.1", features = ["rt", "net", "time", "sync", "macros", "signal"] }
