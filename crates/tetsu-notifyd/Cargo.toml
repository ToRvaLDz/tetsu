[package]
name = "tetsu-notifyd"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Tetsu notification server: org.tetsu.notify.v1 and org.freedesktop.Notifications"

[lints]
workspace = true

[dependencies]
cosmic-text = "0.19.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop"] }
tetsu-bus = { path = "../tetsu-bus" }
tiny-skia = "0.12.0"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "macros", "time", "sync"] }
zbus = { version = "6.1.0", default-features = false, features = ["tokio", "proxy", "service"] }

[dev-dependencies]
futures-util = "0.3"
serde_json = "1.0.154"
tempfile = "3"
tokio = { version = "1.54.1", features = ["rt", "net", "io-util", "macros", "time", "sync"] }
