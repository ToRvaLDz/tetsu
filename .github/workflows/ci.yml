name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Installs the toolchain pinned in rust-toolchain.toml
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings

  # Arch Linux, like the target: the end-to-end boot tests need the real
  # ukify, sbsign, sbverify and the systemd EFI stubs, and fail when missing.
  test:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed systemd systemd-ukify sbsigntools openssl binutils rustup gcc git
      - uses: actions/checkout@v4
      - run: rustup show
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --workspace --locked
      # The contract suite validates the IDL with systemd's varlinkctl and
      # fails instead of skipping when it is missing.
      - run: cargo test --workspace --locked

  # IDL validation with a current varlinkctl (Arch Linux systemd).
  varlinkctl:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed systemd rustup gcc
      - uses: actions/checkout@v4
      - run: rustup show
      - run: varlinkctl --version
      - run: cargo test -p tetsu-bus --test contract_varlinkctl --locked
        env:
          TETSU_REQUIRE_VARLINKCTL: "1"

  # Unit tests of the VM harness: no ISO, no KVM, no QEMU needed.
  vm-harness:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax-check every script
        run: |
          fail=0
          for f in tools/vm/tetsu-vm tools/vm/fetch-arch-iso tools/vm/lib/*.sh tools/vm/tests/*.sh; do
            bash -n "$f" || fail=1
          done
          exit "$fail"
      # socat backs the `send` unit test
      - run: sudo apt-get update && sudo apt-get install -y socat
      - run: tools/vm/tests/unit.sh
