# Settings shared by the two images (see README.md): the payload (the system
# that is installed) and the installer (the USB medium). The profile chosen on
# the mkosi command line, `payload` or `installer`, adds the rest. Run
# `image/build` rather than mkosi directly: it stages the Tetsu binaries and
# passes them with --extra-tree.

[Distribution]
Distribution=arch
Architecture=x86-64

[Build]
WithNetwork=yes

[Content]
WithDocs=no
CleanPackageMetadata=no
