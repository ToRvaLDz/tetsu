# The installer: an unsigned USB image. Firmware is in Setup Mode or has
# Secure Boot off when it boots, so nothing here is signed.

[Output]
Format=disk
Output=tetsu-installer
CompressOutput=no

[Content]
Bootable=yes
Bootloader=systemd-boot
# Both consoles; the last one listed receives /dev/console, so the serial
# line carries the kernel and systemd messages as well.
KernelCommandLine=console=tty0 console=ttyS0,115200
Packages=
        base
        linux
        systemd
        systemd-ukify
        mkinitcpio
        cryptsetup
        btrfs-progs
        dosfstools
        util-linux
        gptfdisk
        openssl
        sbsigntools
        efitools
        efibootmgr
        tar
        kbd
        tzdata
        tpm2-tss
