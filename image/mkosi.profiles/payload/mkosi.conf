# The payload: the system extracted into the first snapshot of an install.

[Output]
Format=tar
Output=tetsu-payload
# The installer extracts it with plain tar, over a medium that has no use for
# a second compression layer.
CompressOutput=no

[Content]
Bootable=no
Bootloader=none
Packages=
        base
        linux
        intel-ucode
        amd-ucode
        systemd
        systemd-ukify
        mkinitcpio
        btrfs-progs
        cryptsetup
        tpm2-tss
        sbsigntools
        efitools
        efibootmgr
        util-linux
        sudo
        archlinux-keyring
        pacman
        dosfstools
