# The payload: the system extracted into the first snapshot of an install.

[Output]
Format=tar
Output=tetsu-payload
# The installer extracts it with plain tar, over a medium that has no use for
# a second compression layer.
CompressOutput=no

[Content]
Bootable=no
Bootloader=none
# Only the tetsu-base meta-package: the base set is its depends, in
# image/tetsu-base/PKGBUILD (image/build builds it and hands it to mkosi).
Packages=
        tetsu-base
