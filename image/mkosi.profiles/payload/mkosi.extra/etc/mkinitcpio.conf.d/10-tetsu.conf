# Initrd of the installed system, built by `tetsu-tx` (mkinitcpio -k VER -g
# /usr/lib/tetsu/initrd.img) and wrapped into a UKI by ukify.
#
# systemd-based initrd: sd-encrypt opens the LUKS2 root named on the kernel
# command line, and tetsu-seal (after systemd and sd-encrypt) seals it to the
# TPM at the first boot; tetsu carries the user's /etc changes into the first
# boot of a snapshot a transaction built. No `resume`: there is no swap partition.
HOOKS=(base systemd autodetect microcode modconf kms keyboard sd-vconsole block sd-encrypt filesystems fsck tetsu-seal tetsu)
COMPRESSION="zstd"
