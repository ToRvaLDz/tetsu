# The bus registry of the session services (#15), in $XDG_RUNTIME_DIR.
d %t/tetsu 0700 - - -
d %t/tetsu/registry 0700 - - -

# The secret stores of $HOME that tetsu-agent.service masks (#82). They are
# made here so the mask names a directory that always exists, never one that
# a later login creates (the unit lists them without "-"). tmpfiles has no
# %E: the config credstore is %h/.config/credstore*, as systemd looks it up
# when XDG_CONFIG_HOME is not set.
d %h/.config/credstore 0700 - - -
d %h/.config/credstore.encrypted 0700 - - -
d %h/.local/lib/credstore 0700 - - -
d %h/.local/lib/credstore.encrypted 0700 - - -
d %h/.local/share/tetsu/secrets 0700 - - -
d %h/.local/share/keyrings 0700 - - -
